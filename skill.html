<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Skill详情 · lilyluo.ai</title><style>
@import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Manrope:wght@400;600;700;800&family=Noto+Serif+SC:wght@600;800&display=swap');:root{--ink:#18221d;--muted:#718078;--paper:#f3f1e9;--acid:#c8f45a;--line:#d8ddd2;--red:#e85d45}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:Manrope,"Noto Sans SC",sans-serif}.top,main,footer{max-width:1000px;margin:auto}.top{padding:24px 28px;border-bottom:1px solid var(--ink);display:flex;justify-content:space-between}.brand{font-weight:800}.brand span{color:var(--red)}a{color:inherit}.back{font-size:13px;color:var(--muted)}main{padding:70px 28px 100px}.kicker{font:12px "DM Mono";color:var(--red);letter-spacing:.12em}.hero{display:flex;justify-content:space-between;gap:30px;align-items:end}.hero h1{font:800 clamp(42px,8vw,88px)/1 "Noto Serif SC",serif;letter-spacing:-.08em;margin:18px 0}.badge{border:1px solid var(--ink);padding:12px 15px;font:12px "DM Mono"}.intro{max-width:680px;color:var(--muted);line-height:1.9;font-size:16px}.panel{border-top:1px solid var(--ink);margin-top:45px;padding-top:22px}.panel h2{font-size:16px}.reason{background:#fffef8;border-left:3px solid var(--acid);padding:18px;line-height:1.8}.tags{display:flex;gap:8px;flex-wrap:wrap}.tag{border:1px solid var(--line);padding:6px 9px;font:11px "DM Mono"}.actions{display:flex;gap:12px;flex-wrap:wrap;margin-top:30px}.button{padding:13px 17px;border:1px solid var(--ink);text-decoration:none;font-size:13px}.primary{background:var(--ink);color:var(--paper)}footer{border-top:1px solid var(--ink);padding:24px 28px;color:var(--muted);font-size:12px}@media(max-width:700px){.hero{display:block}.badge{display:inline-block}.hero h1{font-size:54px}}
</style></head><body><header class="top"><div class="brand">skill<span>精选</span> / lilyluo.ai</div><a class="back" href="index.html">← 返回精选列表</a></header><main id="app"><p>正在加载 Skill…</p></main><footer>数据源：<a href="https://skills.sh" target="_blank">skills.sh</a> · <a href="https://skillsmp.com/zh" target="_blank">SkillsMP</a></footer><script>
const id=new URLSearchParams(location.search).get('id');fetch('data/skills.json',{cache:'no-store'}).then(r=>r.json()).then(items=>{const s=items.find(x=>x.n===id);if(!s)throw Error('not found');document.title=s.n+' · Skill精选';document.querySelector('#app').innerHTML=`<div class="kicker">SKILL DETAIL / ${s.cat}</div><div class="hero"><h1>${s.n}</h1><div class="badge">${s.v} DOWNLOADS</div></div><p class="intro">${s.d}</p><section class="panel"><h2>为什么推荐</h2><div class="reason">${s.r}</div></section><section class="panel"><h2>标签</h2><div class="tags">${s.t.map(t=>`<span class="tag">${t}</span>`).join('')}</div></section><section class="panel"><h2>作者与来源</h2><p class="intro">${s.a}</p><div class="actions"><a class="button primary" href="${s.source||'https://skills.sh'}" target="_blank" rel="noreferrer">打开原始来源 ↗</a><a class="button" href="index.html">继续探索其他 Skills</a></div></section>`}).catch(()=>{document.querySelector('#app').innerHTML='<h1>暂时找不到这个 Skill</h1><p class="intro">请返回精选列表重新选择。</p><a href="index.html">← 返回首页</a>'});
</script></body></html>
